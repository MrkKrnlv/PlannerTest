# Конфиг для локальной разработки (npm run dev:api): тот же Worker, но без Workers AI —
# AI работает только удалённо и требует CLOUDFLARE_API_TOKEN. Бот локально отвечает ошибкой AI, остальное работает.
name = "plannertest"
main = "server/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "planner"
database_id = "2e2d823a-044c-4eb2-949d-1a8b7bc31898"
